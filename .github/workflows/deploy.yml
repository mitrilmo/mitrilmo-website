name: Deploy to GitHub Pages

# Push auf main: prüfen, bauen, veröffentlichen. Pull Requests: nur prüfen und bauen, nicht veröffentlichen.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Baumodus über die Repo-Variable STAGING (Settings → Secrets and variables → Actions → Variables).
    # Nicht gesetzt = Staging (Test-URL, noindex). Im Live-Repo auf false stellen = Live-Build (www.mitrilmo.com).
    # Gilt für alle Schritte, auch für die Astro-Aktion unten, die selbst noch einmal baut.
    env:
      STAGING: ${{ vars.STAGING }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run check:content
      - run: npm run build
      - run: npm run check:dist
      # Größenwarnung (AP4.7): Repository über 300 MB (Wert der GitHub-API in KB). Nur Hinweis, bricht nichts ab.
      - name: Repo-Größe prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kb=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .size || echo 0)
          mb=$((kb / 1024))
          echo "Repository: ${mb} MB"
          if [ "$mb" -gt 300 ]; then echo "::warning::Repository ist ${mb} MB groß (Warnschwelle 300 MB). Historie bereinigen prüfen (Umsetzungsplan AP4.7)."; fi
      - uses: withastro/action@v6
        with:
          node-version: 24
          cache: "false" # v6 cacht node_modules/.astro; aus, damit der Build wie bisher frisch läuft
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
